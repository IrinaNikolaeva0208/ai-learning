# Integration tests against a real SQLite database, isolated from the api
# container's data. Self-contained — not merged with docker-compose.yml:
#   npm run docker:test
services:
  api_test:
    build:
      context: .
      # Dev dependencies are needed for Jest and the Prisma CLI.
      target: development
    image: bookmark-manager-test
    # Shared with local e2e runs; setup-e2e.ts recreates this database.
    env_file:
      - .env.test
    volumes:
      # Current sources, so tests run without rebuilding the image.
      - ./src:/app/src
      - ./test:/app/test
      - ./prisma:/app/prisma
      # Throwaway database, never shared with the api container.
      - sqlite-test-data:/app/data
    command: npm run test:e2e

volumes:
  sqlite-test-data:
