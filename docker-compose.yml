# Development stack: the API in watch mode against a local SQLite file.
# Integration tests live in docker-compose.test.yml.
# The production image is the Dockerfile's `runtime` stage, built directly
# (`docker build -t bookmark-manager .`) — no compose file drives it.
services:
  api:
    build:
      context: .
      target: development
    image: bookmark-manager-dev
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      # Relative file: URLs resolve from prisma/, i.e. /app/data/dev.db.
      DATABASE_URL: file:../data/dev.db
    volumes:
      # Current sources, so edits reload without a rebuild.
      - ./src:/app/src
      - ./test:/app/test
      - ./prisma:/app/prisma
      # Bind mount, not a named volume: the dev database stays inspectable
      # from the host (`npm run prisma:studio`) and is shared with local runs.
      - ./data:/app/data
    # Apply pending migrations, then start Nest in watch mode. exec lets SIGTERM
    # reach npm instead of stopping at the sh wrapper.
    # --no-shell makes the CLI spawn node directly; with the default shell
    # wrapper a reload orphans the old process and the restart hits EADDRINUSE.
    command: sh -c "npx prisma migrate deploy && exec npm run start:dev -- --no-shell"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
